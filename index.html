<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Store Coach</h1>
    <p>Tell us about the customer. Get the right look, the add-ons, and what to say.</p>
  </header>

  <main>
    <form id="brief" class="card">
      <h2>Customer brief</h2>
      <div class="grid">
        <label>Occasion <select name="occasion" id="occasion"></select></label>
        <label>Their role <select name="role" id="role"></select></label>
        <label>Budget (₹) <input name="budget" type="number" min="1000" step="500" value="25000" required /></label>
        <label>Preferred colour <select name="colour" id="colour"></select></label>
        <label>Size <select name="size" id="size"></select></label>
        <label>Season <select name="season">
          <option value="winter">Winter</option>
          <option value="summer">Summer</option>
          <option value="monsoon">Monsoon</option>
        </select></label>
      </div>
      <button type="submit">Coach me</button>
    </form>

    <section id="results" aria-live="polite"></section>
  </main>

  <footer>Built by Vibe Syndicate at Vibe Coders Hackathon, Kolkata. Demo uses a sample catalog, not real store data.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
