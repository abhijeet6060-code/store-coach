<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Store Coach</h1>
    <p>Every morning: which stores need attention and why, and one thing each salesperson can do better today.</p>
    <p class="runinfo" id="runinfo">Loading today's run…</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="am" aria-selected="true">Area managers</button>
    <button role="tab" data-tab="sp" aria-selected="false">Salesperson cards</button>
    <button role="tab" data-tab="data" aria-selected="false">Data issues</button>
  </nav>

  <main>
    <section id="tab-am"></section>
    <section id="tab-sp" hidden></section>
    <section id="tab-data" hidden></section>
  </main>

  <footer>Built by Vibe Syndicate at Vibe Coders Hackathon, Kolkata. Runs on the synthetic Manyavar data pack (1 Nov 2024 – 31 Oct 2026).</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
