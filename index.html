<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Store Coach</title>
  <meta name="description" content="Every morning: which stores need attention and why, and one thing each salesperson can do better today." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/theme-dark.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E0621A'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">SC</span>
        <div class="brand-name">Store Coach</div>
      </div>
      <div class="profile">
        <span class="avatar" id="am-avatar">SC</span>
        <div class="profile-txt">
          <div class="who-name" id="who-name"></div>
          <div class="profile-sub" id="am-sub"></div>
          <a class="switch" href="#welcome"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13"/><path d="m14 4.5 3.5 3.5L14 11.5"/><path d="M20 16H7"/><path d="m10 12.5-3.5 3.5 3.5 3.5"/></svg> Switch role</a>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="runbox" id="runbox"></div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="menu" id="menu" aria-label="Open menu"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
        <span class="top-title" id="top-title">Store Coach</span>
        <a class="bell" href="#followups" aria-label="Follow-ups"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="dot" id="bell-dot"></span></a>
      </header>
      <main id="view" tabindex="-1"><p class="loading">Loading today's run…</p></main>
      <footer class="foot">Vibe Syndicate · Vibe Coders Hackathon, Kolkata · Hackathon prototype on the synthetic Manyavar data pack (1 Nov 2024 – 31 Oct 2026). Not an official Manyavar product.</footer>
    </div>

    <nav class="bottomnav" id="bottomnav" aria-label="Sections"></nav>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
