name: Store Coach daily run

# Runs every morning at 06:00 IST without anyone asking: rebuilds report.json
# from the data and deploys it to the live Vercel site. It never commits to the repo.
# Needs three repository secrets (added in GitHub settings, never in code):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Store Coach
        run: python pipeline/coach.py --data data --out report.json
      - name: Summary
        run: |
          python -c "import json;r=json.load(open('report.json',encoding='utf-8'));print('as of',r['as_of'],'run',r['generated_at']);[print(am['name'],'-',len(am['alerts']),'alerts') for am in r['area_managers']]" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@39.1.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@39.1.1 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@39.1.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
