name: Store Coach daily run

# Runs every morning at 06:00 IST without anyone asking, rebuilds the report
# from the data and redeploys the page. It never commits to the repo.
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Store Coach
        run: |
          mkdir -p _site
          python pipeline/coach.py --data data --out _site/report.json
          cp -r index.html style.css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
